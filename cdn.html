<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奶龙贪吃蛇</title>
<!--
  ============================================================
  奶龙贪吃蛇 · 搞怪版 —— 单文件小游戏（背景音乐为外部文件，需放在同文件夹）
  设计概念：糖果色 + 漫画黑描边 + 跳跳糖标题 + 搞怪贴纸
  蛇头与豆子用 D 盘微信照片（已嵌入本文件）
  背景音乐：《奶龙贪吃蛇》bgm-small.m4a（CDN 版，18MB 小体积，循环播放）
  想学代码的话，按下面顺序读：
    1) HTML 结构（body 里有什么）
    2) CSS 样式（<style> 里的配色与布局）
    3) JavaScript（<script> 里分 7 步：设置→状态→流程→逻辑→输入→绘制→音效）
  ============================================================
-->
<style>
  /* ============ 配色（搞怪糖果风） ============ */
  :root{
    --cream:#FFF7E6;        /* 奶油底 */
    --cream-2:#FFF0D1;      /* 棋盘浅格 */
    --ink:#2B2B33;          /* 漫画黑描边 */
    --ink-soft:#6F6A7E;     /* 次要文字 */
    --yellow:#FFD23F;       /* 奶龙黄 */
    --pink:#FF6FA5;         /* 泡泡糖粉 */
    --teal:#2FD8C0;         /* 薄荷青 */
    --purple:#6C3BD1;       /* 葡萄紫 */
    --white:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    display:flex; justify-content:center;
    background-color:var(--cream);
    background-image:
      radial-gradient(circle 10px at 12% 16%, rgba(255,111,165,.22) 99%, transparent 100%),
      radial-gradient(circle 8px  at 88% 10%, rgba(47,216,192,.25) 99%, transparent 100%),
      radial-gradient(circle 12px at 7%  78%, rgba(255,210,63,.40) 99%, transparent 100%),
      radial-gradient(circle 9px  at 92% 86%, rgba(108,59,209,.18) 99%, transparent 100%),
      radial-gradient(circle 7px  at 68% 30%, rgba(255,111,165,.18) 99%, transparent 100%),
      radial-gradient(circle 26px at 50% 46%, rgba(255,210,63,.10) 99%, transparent 100%),
      repeating-linear-gradient(45deg, rgba(43,43,51,.035) 0 2px, transparent 2px 24px);
    color:var(--ink);
    font-family:"YouYuan","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  .page{
    width:min(94vw,800px);
    padding:36px 16px 48px;
    display:flex; flex-direction:column; align-items:center;
    position:relative;
  }
  /* 漂浮搞怪贴纸 */
  .sticker{
    position:absolute; z-index:2;
    display:flex; align-items:center; justify-content:center;
    width:62px; height:62px; border-radius:50%;
    background:var(--white); border:3px solid var(--ink);
    font-size:19px; font-weight:700;
    box-shadow:4px 4px 0 var(--ink);
    animation:wobble 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  .sticker.s1{ top:104px; left:-8px;  transform:rotate(-12deg); background:var(--yellow); }
  .sticker.s2{ top:64px;  right:-4px; transform:rotate(10deg);  background:var(--pink); color:#fff; animation-delay:.5s; }
  .sticker.s3{ bottom:210px; left:-14px; transform:rotate(8deg); background:var(--teal); animation-delay:1s; }
  @keyframes wobble{
    0%,100%{ translate:0 0; }
    50%{ translate:0 -8px; }
  }

  /* ============ 题头：跳跳糖字块 + 搞怪贴纸 ============ */
  .masthead{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:26px; }
  .title-tiles{ display:flex; gap:12px; margin:0; }
  .tile{
    font-weight:700; font-size:40px; line-height:1;
    padding:12px 14px; border-radius:16px;
    border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    animation:bob 1.8s ease-in-out infinite;
  }
  .tile.t1{ background:var(--yellow); transform:rotate(-5deg); }
  .tile.t2{ background:var(--pink); color:#fff; transform:rotate(3deg); animation-delay:.2s; }
  .tile.t3{ background:var(--teal); transform:rotate(-3deg); animation-delay:.4s; }
  .tile.t4{ background:var(--purple); color:#fff; transform:rotate(4deg); animation-delay:.6s; }
  .tile.t5{ background:var(--yellow); transform:rotate(-2deg); animation-delay:.8s; }
  @media (max-width:430px){
    .tile{ font-size:26px; padding:9px 10px; }
    .title-tiles{ gap:8px; }
  }
  @keyframes bob{
    0%,100%{ translate:0 0; }
    50%{ translate:0 -7px; }
  }
  .subtitle{
    margin:4px 0 0;
    font-size:14px; color:var(--ink-soft); letter-spacing:.12em;
  }

  /* ============ 记分栏 ============ */
  .score-row{
    width:100%; max-width:750px;
    display:flex; align-items:center; justify-content:center; gap:26px;
    margin-bottom:22px;
  }
  .score-box{
    display:flex; flex-direction:column; align-items:center;
    background:var(--white); border:3px solid var(--ink); border-radius:14px;
    padding:6px 20px 4px; min-width:92px;
    box-shadow:4px 4px 0 var(--ink);
    transform:rotate(-1.5deg);
  }
  .score-box + .score-box{ transform:rotate(1.5deg); background:var(--yellow); }
  .score-box .label{ font-size:12px; color:var(--ink-soft); letter-spacing:.25em; text-indent:.25em; }
  .score-box .num{ font-size:28px; font-weight:700; line-height:1.2; }
  .sound-btn{
    margin-left:auto;
    padding:8px 16px;
    background:var(--white); border:3px solid var(--ink); border-radius:999px;
    color:var(--ink); font-family:inherit; font-weight:700; font-size:12.5px; letter-spacing:.08em;
    box-shadow:3px 3px 0 var(--ink); cursor:pointer; transform:rotate(1.5deg);
    transition:transform .12s, box-shadow .12s;
  }
  .sound-btn:hover{ transform:translate(-2px,-2px) rotate(1.5deg); box-shadow:5px 5px 0 var(--ink); }
  .sound-btn:active{ transform:translate(2px,2px) rotate(1.5deg); box-shadow:1px 1px 0 var(--ink); }
  .sound-btn:focus-visible{ outline:3px dashed var(--purple); outline-offset:2px; }

  /* ============ 漫画相框 + 棋盘（整体放大，看得清） ============ */
  .board-wrap{ width:min(100%,750px); }
  .frame{
    background:var(--yellow);
    border:3px solid var(--ink);
    border-radius:22px;
    padding:14px;
    box-shadow:8px 8px 0 var(--ink);
  }
  .art{
    position:relative;
    background:var(--white);
    border:3px solid var(--ink);
    border-radius:14px;
    overflow:hidden;
  }
  canvas{ display:block; width:100%; height:auto; touch-action:none; }

  /* ============ 遮罩层（漫画对话框风） ============ */
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:rgba(255,247,230,.82);
    animation:popIn .25s cubic-bezier(.34,1.56,.64,1) both;
  }
  .overlay[hidden]{ display:none; }
  @keyframes popIn{ from{ opacity:0; transform:scale(.9) } to{ opacity:1; transform:scale(1) } }
  .over-card{
    margin:0 26px; padding:18px 22px;
    background:var(--white); border:3px solid var(--ink); border-radius:18px;
    box-shadow:6px 6px 0 var(--ink);
    transform:rotate(-2deg);
    max-width:80%;
  }
  .over-msg{
    margin:0;
    font-size:20px; font-weight:700; letter-spacing:.06em;
    text-align:center; line-height:1.55; white-space:pre-line;
  }
  .restart{
    padding:11px 36px;
    background:var(--pink); color:#fff;
    border:3px solid var(--ink); border-radius:999px;
    font-family:inherit; font-weight:700;
    font-size:18px; letter-spacing:.2em; text-indent:.2em;
    cursor:pointer;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .restart:hover{ transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--ink); }
  .restart:active{ transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink); }
  .restart:focus-visible{ outline:3px dashed var(--purple); outline-offset:3px; }
  .restart[hidden]{ display:none; }

  /* ============ 说明文字 ============ */
  .legend{ margin:24px 0 0; font-size:13px; color:var(--ink-soft); letter-spacing:.06em; text-align:center; }
  .foot{ margin-top:30px; font-size:12px; color:var(--ink-soft); letter-spacing:.1em; text-align:center; }

  /* ============ 手机/平板的方向键 ============ */
  .dpad{ display:none; }
  @media (pointer:coarse){
    .dpad{
      display:grid;
      grid-template-areas:". u ." "l d r";
      gap:10px; margin-top:24px;
    }
    .dpad button{
      width:58px; height:58px;
      background:var(--white); border:3px solid var(--ink); border-radius:14px;
      color:var(--ink); font-size:20px; font-family:inherit; font-weight:700;
      box-shadow:3px 3px 0 var(--ink);
      cursor:pointer; -webkit-tap-highlight-color:transparent;
    }
    .dpad button:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
    .dpad .up{ grid-area:u; background:var(--yellow) }
    .dpad .down{ grid-area:d; background:var(--pink); color:#fff }
    .dpad .left{ grid-area:l; background:var(--teal) }
    .dpad .right{ grid-area:r; background:var(--purple); color:#fff }
  }

  @media (prefers-reduced-motion:reduce){
    .overlay{ animation:none; }
    .tile, .sticker{ animation:none; }
  }
</style>
</head>
<body>
<main class="page">

  <span class="sticker s1" aria-hidden="true">哈!</span>
  <span class="sticker s2" aria-hidden="true">咻~</span>
  <span class="sticker s3" aria-hidden="true">豆!</span>

  <header class="masthead">
    <h1 class="title-tiles">
      <span class="tile t1">奶</span><span class="tile t2">龙</span><span class="tile t3">贪</span><span class="tile t4">吃</span><span class="tile t5">蛇</span>
    </h1>
    <p class="subtitle">搞怪版 · 别把蛇绕晕了</p>
  </header>

  <div class="score-row">
    <div class="score-box"><span class="label">吃掉</span><span class="num" id="score">0</span></div>
    <div class="score-box"><span class="label">最高纪录</span><span class="num" id="best">0</span></div>
    <button class="sound-btn" id="soundBtn" aria-pressed="true">声音 开</button>
  </div>

  <div class="board-wrap">
    <div class="frame">
      <div class="art">
        <canvas id="board" aria-label="奶龙贪吃蛇游戏棋盘"></canvas>
        <div class="overlay" id="overlay">
          <div class="over-card"><p class="over-msg" id="overMsg">按空格开吃！</p></div>
          <button class="restart" id="restartBtn" hidden>再来一局</button>
        </div>
      </div>
    </div>
  </div>

  <p class="legend">点鼠标 / 点屏幕空白处 = 顺时针转向 · 空格 暂停/开始 · 回车 重开</p>

  <div class="dpad" aria-label="方向按钮">
    <button class="up"    data-dir="up"    aria-label="向上">↑</button>
    <button class="left"  data-dir="left"  aria-label="向左">←</button>
    <button class="down"  data-dir="down"  aria-label="向下">↓</button>
    <button class="right" data-dir="right" aria-label="向右">→</button>
  </div>

  <p class="foot">奶龙贪吃蛇 · CDN 版</p>
</main>

<script>
// ============================================================
// 奶龙贪吃蛇 · 搞怪版 —— JavaScript 部分
// ============================================================

// ----- 1. 游戏设置 -----
const COLS = 21, ROWS = 21;          // 棋盘格数（21×21）
const CELL = 24;                     // 每格多少像素
const PAD = 16;                      // 棋盘四周留白，让大头像/大豆子不会画到画布外
const SIZE = COLS * CELL + PAD * 2;  // 画布逻辑尺寸 536×536
const RSCALE = 1.25;                 // 渲染分辨率再放大 25%，棋盘变大后线条依然清晰
const BASE_MS = 140, MIN_MS = 70, STEP_MS = 5; // 速度：起步 140ms/步，每吃一颗加快 5ms

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
// 高分屏（Retina）下按比例放大画布，线条更清晰
const dpr = window.devicePixelRatio || 1;
canvas.width = SIZE * dpr * RSCALE;
canvas.height = SIZE * dpr * RSCALE;
ctx.setTransform(dpr * RSCALE, 0, 0, dpr * RSCALE, 0, 0);

// 四个方向：x/y 表示每步移动的格子数
const DIRS = {
  up:    { x: 0,  y: -1 },
  down:  { x: 0,  y:  1 },
  left:  { x: -1, y:  0 },
  right: { x: 1,  y:  0 },
};

// 是不是触屏设备（手机/平板），提示文案会不一样

const headImg = new Image();
const foodImg = new Image();
let headOk = false, foodOk = false, spritesLoaded = false;

// 头像转向：照片默认朝右时用 0；若照片本身朝上，改成 -Math.PI/2
const HEAD_ROT_OFFSET = 0;

// 把照片“取中间正方形”画进指定区域，避免拉伸变形
function drawImageCenterCrop(img, dx, dy, d){
  const w = img.naturalWidth, h = img.naturalHeight;
  const side = Math.min(w, h);
  const sx = (w - side) / 2, sy = (h - side) / 2;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, sx, sy, side, side, dx, dy, d, d);
}

// 等两张照片都解码完成再亮出“开始”提示，避免一闪而过的空白
function boot(){
  headImg.src = HEAD_IMG_DATA;
  foodImg.src = FOOD_IMG_DATA;
  let n = 0;
  const done = () => { if (++n === 2){ spritesLoaded = true; setState('ready'); } };
  headImg.onload  = () => { headOk = true;  done(); };
  foodImg.onload  = () => { foodOk = true;  done(); };
  headImg.onerror = done;  // 万一加载失败，退回手绘样式
  foodImg.onerror = done;
}

// 角度差归一化：转头动画永远走最短的弧线
function shortestAngle(d){ return Math.atan2(Math.sin(d), Math.cos(d)); }

// ----- 2.5 背景音乐：奶龙贪吃蛇（和本文件放同一文件夹） -----
const bgm = new Audio('bgm-small.m4a');
bgm.loop = true;          // 循环播放
bgm.volume = 0.35;        // 音乐音量，别盖过音效
bgm.preload = 'auto';

// ----- 3. 游戏状态 -----
let snake, dir, nextDir, food;      // 蛇身坐标数组、当前方向、排队方向、食物
let score = 0, speed = BASE_MS;     // 分数、当前速度
let state = 'ready';                // ready(待开始) | running | paused | over
let acc = 0, last = 0, pulse = 0;   // 计时器
// 平滑动画用：上一格的蛇身快照、上一帧/当前帧的头朝向、果子出生时间
let prevSnake = [], prevDir = 0, curDir = 0, foodSpawnAt = 0;

const overlay    = document.getElementById('overlay');
const overMsg    = document.getElementById('overMsg');
const restartBtn = document.getElementById('restartBtn');
const scoreEl    = document.getElementById('score');
const bestEl     = document.getElementById('best');

// 最高分存进 localStorage，关掉页面也不会丢
let best = Number(localStorage.getItem('snake.best.v1')) || 0;
bestEl.textContent = best;

// ----- 3. 开始 / 暂停 / 结束的流程控制 -----
function resetAndStart(){
  // 蛇从棋盘中间出发，初始 3 节，向右爬
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = DIRS.right;
  nextDir = DIRS.right;
  prevSnake = snake.map(s => ({ ...s }));
  prevDir = 0; curDir = 0;
  score = 0; speed = BASE_MS; acc = 0;
  scoreEl.textContent = 0;
  spawnFood();
  setState('running');
  // 用户点了/按了才进来，满足浏览器“允许自动播放”的条件
  if (!muted && bgm.paused) bgm.play().catch(() => {});
}

function setState(s){
  state = s;
  if (s === 'running'){
    overlay.hidden = true;
  } else {
    overlay.hidden = false;
    restartBtn.hidden = (s !== 'over');
    if (s === 'ready')  overMsg.textContent = isTouchDevice ? '点一下屏幕开吃！' : '按空格开吃！点哪都行～';
    if (s === 'paused') overMsg.textContent = isTouchDevice ? '歇会儿，别慌～点一下继续' : '歇会儿，别慌～按空格继续';
    // 'over' 时的文字由 gameOver() / spawnFood() 提前写好
  }
}

// 游戏结束时的搞怪台词（随机抽一句）
const OVER_LINES = [
  '撞墙了吧，哈哈！',
  '自己咬自己，笨蛋！',
  '蛇生无常，再来！',
  '这波走位有点秀～',
  '再快一点就是世界冠军了！',
];

function gameOver(){
  const isRecord = score > best;
  if (isRecord){
    best = score;
    localStorage.setItem('snake.best.v1', best);
    bestEl.textContent = best;
  }
  const line = OVER_LINES[Math.floor(Math.random() * OVER_LINES.length)];
  overMsg.textContent = `吃到 ${score} 颗豆子！${isRecord ? '\n🏆 新纪录，有点东西！' : ''}\n${line}`;
  setState('over');
  sndOver();
}

function spawnFood(){
  // 找出所有没被蛇占用的格子，随机挑一个放豆子
  const free = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });

  if (free.length === 0){ // 整张棋盘都填满了 = 通关！
    overMsg.textContent = '你把棋盘吃光啦！\n离谱！';
    setState('over');
    sndOver();
    return;
  }
  food = free[Math.floor(Math.random() * free.length)];
  foodSpawnAt = performance.now(); // 记录出生时间，用来做“长出来”的动画
}

// ----- 4. 每一步的核心逻辑 -----
function tick(){
  // 先给当前蛇身拍张快照：渲染时在“旧位置→新位置”之间做平滑过渡
  prevSnake = snake.map(s => ({ ...s }));
  prevDir = curDir;

  dir = nextDir; // 一次只转一个弯，防止一格内 180° 掉头
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

  const willEat = head.x === food.x && head.y === food.y;
  // 没吃到时蛇尾这一步会移开，所以检查身体时把尾巴去掉
  const body = willEat ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

  snake.unshift(head); // 头部前进一格
  curDir = Math.atan2(dir.y, dir.x); // 记录头朝向（弧度），转头动画用
  if (willEat){
    score++;
    scoreEl.textContent = score;
    speed = Math.max(MIN_MS, speed - STEP_MS); // 越吃越快
    spawnFood();
    if (state !== 'running') return;           // 填满棋盘，直接胜利
    sndEat();
  } else {
    snake.pop(); // 没吃到就砍掉尾巴，蛇身长度不变
  }
}

// ----- 5. 输入处理 -----
function turn(name){
  const d = DIRS[name];
  if (!d) return;
  const lastD = nextDir;
  if (d.x === -lastD.x && d.y === -lastD.y) return; // 不能原地掉头
  nextDir = d;
}

// 点一下：顺时针转 90°（右→下→左→上→右）
function turnClockwise(){
  const a = Math.atan2(nextDir.y, nextDir.x) + Math.PI / 2;
  const d = { x: Math.round(Math.cos(a)), y: Math.round(Math.sin(a)) };
  if (d.x === -dir.x && d.y === -dir.y) return; // 不允许 180° 掉头，忽略这次点击
  nextDir = d;
}

window.addEventListener('keydown', e => {
  if (e.isComposing) return; // 中文输入法打字时不要误触
  const k = e.key;
  if (k === ' ') e.preventDefault(); // 防止页面滚动

  if (k === 'Enter'){ resetAndStart(); return; }
  if (k === ' '){
    if (state === 'running')      setState('paused');
    else if (state === 'paused')  setState('running');
    else                          resetAndStart(); // ready / over
  }
});

// 点击棋盘（或覆盖其上的提示层）：
// 游戏中 = 顺时针转向；待开始/结束 = 开始；暂停 = 继续
function startByClick(){
  if (state === 'running'){ turnClockwise(); return; }
  if (state === 'ready' || state === 'over') resetAndStart();
  else if (state === 'paused') setState('running');
}
canvas.addEventListener('click', startByClick);
overlay.addEventListener('click', startByClick);

// 手机上：滑动屏幕按滑动方向转向；点一下空白处 = 顺时针转向
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // 太短算点击，交给 click 处理
  e.preventDefault(); // 阻止这次滑动又触发一次点击
  if (state === 'ready' || state === 'over') resetAndStart();
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
}, { passive: false });

// 手机上的方向按钮
document.querySelectorAll('.dpad button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state === 'ready' || state === 'over') resetAndStart();
    turn(btn.dataset.dir);
  });
});

// 切走页面时自动暂停，回来按空格继续
window.addEventListener('blur', () => { if (state === 'running') setState('paused'); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'running') setState('paused');
});

// “再来一局”按钮
restartBtn.addEventListener('click', resetAndStart);

// 声音开关（背景音乐 + 音效一起控制）
const soundBtn = document.getElementById('soundBtn');
let muted = localStorage.getItem('snake.muted.v1') === '1';
function updateSoundBtn(){
  soundBtn.textContent = muted ? '声音 关' : '声音 开';
  soundBtn.setAttribute('aria-pressed', String(!muted));
}
soundBtn.addEventListener('click', () => {
  muted = !muted;
  localStorage.setItem('snake.muted.v1', muted ? '1' : '0');
  if (muted){ bgm.pause(); }
  else { bgm.play().catch(() => {}); }
  updateSoundBtn();
});
updateSoundBtn();

// ----- 6. 绘制（Canvas 画搞怪风棋盘） -----
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function draw(t){
  // 整块画布先铺一层浅格色（棋盘四周留白就是这个色）
  ctx.fillStyle = '#FFF0D1';
  ctx.fillRect(0, 0, SIZE, SIZE);

  // 奶油棋盘格：两色浅格交错，像野餐布
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++){
      ctx.fillStyle = (x + y) % 2 ? '#FFF7E6' : '#FFF0D1';
      ctx.fillRect(PAD + x * CELL, PAD + y * CELL, CELL, CELL);
    }

  drawFood();
  drawSnake(t);
}

function drawFood(){
  if (!food) return; // 第一局还没开始，场上没有豆子
  const cx = PAD + food.x * CELL + CELL / 2;
  const cy = PAD + food.y * CELL + CELL / 2;

  // 出生动画：260ms 内弹性弹出（先过冲再落稳，搞怪感）
  const grow = Math.min(1, (performance.now() - foodSpawnAt) / 260);
  const back = 1 + 2.70158 * Math.pow(grow - 1, 3) + 1.70158 * Math.pow(grow - 1, 2);
  const ease = grow < 1 ? Math.max(0.01, back) : 1;
  // 运行时轻轻呼吸 + 左右摇头晃脑
  const breath = (state === 'running' && !reducedMotion) ? 1 + 0.05 * Math.sin(pulse / 260) : 1;
  const wob = (state === 'running' && !reducedMotion) ? Math.sin(pulse / 210) * 0.18 : 0;
  const d = CELL * 1.31 * ease * breath; // 豆子直径（1.05 放大 25% → 1.31），看得清

  // 奶龙黄光晕
  const glow = ctx.createRadialGradient(cx, cy, d * 0.2, cx, cy, d * 1.05);
  glow.addColorStop(0, 'rgba(255,210,63,0.35)');
  glow.addColorStop(1, 'rgba(255,210,63,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, d * 1.05, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wob);
  ctx.translate(-cx, -cy);
  if (foodOk){
    // 微信照片：裁成圆形嵌入，边缘干净，无背景色块
    ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.clip();
    drawImageCenterCrop(foodImg, cx - d / 2, cy - d / 2, d);
  } else {
    // 照片加载失败时的备用样式：手绘朱柿
    const r = d / 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#C93C2B'; ctx.fill();
  }
  ctx.restore();
  // 漫画黑描边，和整体风格统一
  ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
  ctx.strokeStyle = '#2B2B33'; ctx.lineWidth = 3; ctx.stroke();
}

function drawSnake(t){
  if (!snake) return; // 第一局还没开始，场上没有蛇

  // 平滑移动：每个节点都在“上一格 → 这一格”之间插值（t: 0→1）
  const pt = i => {
    const cur = snake[i];
    const prev = prevSnake[i] ?? prevSnake[prevSnake.length - 1];
    return {
      x: PAD + (prev.x + (cur.x - prev.x) * t) * CELL + CELL / 2,
      y: PAD + (prev.y + (cur.y - prev.y) * t) * CELL + CELL / 2,
    };
  };

  // 蛇身 + 蛇头连成一体：一整条纯黄色（奶龙黄）
  // 身子粗细 = 蛇头直径，接口处完全无缝（0.60 放大 25% → 0.75）
  const HEAD_R = CELL * 0.75;
  ctx.strokeStyle = '#FFD23F';
  ctx.lineWidth = HEAD_R * 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(pt(0).x, pt(0).y);
  for (let i = 1; i < snake.length; i++)
    ctx.lineTo(pt(i).x, pt(i).y);
  ctx.stroke();

  // 蛇头：先画一个与身子同宽同色的圆头，再把照片嵌进去
  const h0 = pt(0);
  const angle = prevDir + shortestAngle(curDir - prevDir) * t + HEAD_ROT_OFFSET;
  ctx.beginPath(); ctx.arc(h0.x, h0.y, HEAD_R, 0, Math.PI * 2);
  ctx.fillStyle = '#FFD23F'; ctx.fill();

  if (headOk){
    // 照片稍小一圈嵌进黄圆头里，四周留一圈黄色包边
    const photoR = HEAD_R * 0.85;
    ctx.save();
    ctx.translate(h0.x, h0.y);
    ctx.rotate(angle);
    // 圆形裁剪：无论照片背景什么样，都干净地嵌进圆里
    ctx.beginPath(); ctx.arc(0, 0, photoR, 0, Math.PI * 2); ctx.clip();
    drawImageCenterCrop(headImg, -photoR, -photoR, photoR * 2);
    ctx.restore();
  } else {
    // 照片加载失败时的备用样式：纯黄头 + 两只黑点眼睛
    const fx = Math.cos(angle), fy = Math.sin(angle);
    const px = -Math.sin(angle), py = Math.cos(angle);
    [[1, 1], [1, -1]].forEach(([sx]) => {
      const ex = h0.x + px * 5 * sx + fx * 4;
      const ey = h0.y + py * 5 * sx + fy * 4;
      ctx.beginPath(); ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = '#2B2B33'; ctx.fill();
    });
  }
}

// 游戏主循环：一直画，跑起来时按速度推进
function frame(t){
  requestAnimationFrame(frame);
  if (!last) last = t;
  const dt = t - last;
  last = t;
  pulse += dt;

  if (state === 'running'){
    acc += dt;
    while (acc >= speed){
      acc -= speed;
      tick();
      if (state !== 'running'){ acc = 0; break; }
    }
  }
  // 平滑插值进度：运行/暂停时取 0~1，其余状态定格
  const k = (state === 'running' || state === 'paused') ? Math.min(1, acc / speed) : 0;
  draw(k);
}
requestAnimationFrame(frame);

// ----- 7. 音效（Web Audio，不需要任何音频文件） -----
let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function note(freq, at, dur, type, vol){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  o.connect(g);
  g.connect(audioCtx.destination);
  const t = audioCtx.currentTime + at;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t);
  o.stop(t + dur + 0.05);
}
function slide(f0, f1, dur, type, vol, at = 0){
  // 音高从 f0 滑到 f1，做“啵”“呜”这类搞怪音
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  const t0 = audioCtx.currentTime + at;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  o.connect(g);
  g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.start(t0);
  o.stop(t0 + dur + 0.05);
}
function sndEat(){  // 吃到豆子：“啵！”
  if (muted) return;
  ensureAudio();
  note(660, 0,    0.05, 'square', 0.07);
  slide(340, 760, 0.13, 'triangle', 0.12, 0.02);
}
function sndOver(){ // 游戏结束：滑梯下滑“呜～”
  if (muted) return;
  ensureAudio();
  slide(460, 110, 0.50, 'sawtooth', 0.06);
  slide(240, 60,  0.55, 'triangle', 0.07, 0.05);
}

// ----- 启动：照片解码完成后，显示“点击开始” -----
boot();
</script>
